# Keeps dependencies and the pinned workflow actions current through pull
# requests, so a published advisory turns into a reviewable change rather than
# a silent exposure. Security-only for npm to keep noise down; the weekly CI
# audit catches anything that slips.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
